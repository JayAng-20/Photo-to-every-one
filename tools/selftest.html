<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>自我測試 — 本機檔案格式轉換</title>
<link rel="stylesheet" href="../styles/main.css">
<style>
  table { border-collapse: collapse; width: 100%; font-size: .88rem; }
  th, td { border-bottom: 1px solid var(--border); padding: .45rem .5rem; text-align: left; vertical-align: top; }
  th { background: var(--surface-2); position: sticky; top: 0; }
  .pass { color: var(--ok); font-weight: 700; white-space: nowrap; }
  .fail { color: var(--danger); font-weight: 700; white-space: nowrap; }
  .skip { color: var(--text-dim); font-weight: 700; white-space: nowrap; }
  td.detail { color: var(--text-dim); font-size: .82rem; overflow-wrap: anywhere; }
  #summary { font-size: 1.05rem; font-weight: 700; margin: .8rem 0; }
</style>
</head>
<body>
<div class="site-header">
  <h1>自我測試</h1>
  <p class="privacy">這一頁會在你目前的瀏覽器裡實際跑完九條核心路徑並檢查輸出，全程在本機進行。
     用來完成驗收條件第 1、20、21 條（不同瀏覽器實測、離線實測）。</p>
</div>
<main id="main">
  <section class="card">
    <div class="actions">
      <button id="run" class="btn btn-primary">開始測試</button>
      <button id="reload" class="btn">重新整理</button>
    </div>
    <p id="summary">尚未執行。</p>
    <p class="field-note" id="env"></p>
    <div style="overflow-x:auto"><table id="tbl">
      <thead><tr><th>#</th><th>項目</th><th>結果</th><th>實際觀察</th></tr></thead>
      <tbody></tbody>
    </table></div>
  </section>

  <section class="card">
    <h2>離線測試步驟（驗收第 20 條）</h2>
    <ol>
      <li>先在<strong>連線狀態</strong>下開啟主頁 <a href="../index.html">index.html</a>，等 Service Worker 安裝完成（下方狀態會顯示「已啟用」）。</li>
      <li>開啟 DevTools → Network → 勾選 <strong>Offline</strong>（Safari 則用「開發」選單 →「進入離線模式」，或直接關掉 Wi-Fi）。</li>
      <li>重新整理這一頁，再按一次「開始測試」。全部通過就代表離線可用。</li>
    </ol>
    <p id="swstate" class="field-note"></p>
  </section>
</main>

<script type="module">
import { detectBytes, Fmt } from '../src/core/detect.js';
import { getPngDpi, getJpegDpi } from '../src/core/metadata.js';
import { probeCanvasLimits } from '../src/core/canvaslimits.js';
import { suggestedConcurrency, detectCapabilities } from '../src/core/capabilities.js';
import { WorkerPool } from '../src/core/workerpool.js';
import { runConversion } from '../src/core/pipeline.js';
import { StreamingZip } from '../src/core/zip.js';
import { openPdf } from '../src/codecs/pdf-decode.js';
import { ENABLED as HEIC_ENCODE_ENABLED } from '../src/codecs/heic-encode.js';

const tbody = document.querySelector('#tbl tbody');
const rows = [];
let n = 0;

function add(name, ok, detail) {
  n++;
  rows.push({ ok });
  const tr = document.createElement('tr');
  tr.innerHTML = `<td>${n}</td><td></td><td></td><td class="detail"></td>`;
  tr.children[1].textContent = name;
  tr.children[2].textContent = ok === null ? '未執行' : (ok ? 'PASS' : 'FAIL');
  tr.children[2].className = ok === null ? 'skip' : (ok ? 'pass' : 'fail');
  tr.children[3].textContent = detail;
  tbody.appendChild(tr);
}

const ASSETS = {
  pdf: '../test-assets/01_三頁中文文字.pdf',
  png: '../test-assets/04_透明背景.png',
  jpg: '../test-assets/06_一般照片.jpg',
  heic: '../test-assets/07_直式含EXIF方向.heic',
};

async function fileOf(url, name) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`${name}: HTTP ${r.status}`);
  return new File([await r.blob()], name, { type: '' });
}

async function pixels(blob) {
  const bmp = await createImageBitmap(blob);
  const c = document.createElement('canvas');
  c.width = bmp.width; c.height = bmp.height;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(bmp, 0, 0);
  const d = ctx.getImageData(0, 0, bmp.width, bmp.height).data;
  const px = (x, y) => { const o = (y * bmp.width + x) * 4; return [d[o], d[o+1], d[o+2], d[o+3]]; };
  const out = { w: bmp.width, h: bmp.height, tl: px(10, 10), tr: px(bmp.width-11, 10), bl: px(10, bmp.height-11), br: px(bmp.width-11, bmp.height-11) };
  bmp.close(); c.width = c.height = 1;
  return out;
}
function cname(c) {
  const near = (t, tol = 55) => Math.abs(c[0]-t[0]) < tol && Math.abs(c[1]-t[1]) < tol && Math.abs(c[2]-t[2]) < tol;
  if (near([220,30,30])) return '紅'; if (near([30,180,60])) return '綠';
  if (near([40,80,220])) return '藍'; if (near([240,200,20])) return '黃';
  if (c[0] > 235 && c[1] > 235 && c[2] > 235) return '白';
  if (c[0] < 20 && c[1] < 20 && c[2] < 20) return '黑';
  return `(${c[0]},${c[1]},${c[2]})`;
}

const BASE_SETTINGS = {
  quality: 85, background: '#ffffff', maxEdgeEnabled: false, maxEdge: null,
  pdf: { pageSize: 'a4', orientation: 'auto', fitToPage: true, keepAspect: true, merge: false },
  pageRange: 'all',
};

async function convert(file, format, extra = {}) {
  const head = new Uint8Array(await file.slice(0, 4096).arrayBuffer());
  const det = detectBytes(head);
  const item = { id: 'x', file, name: file.name, format: det.format, meta: null };
  if (det.format !== Fmt.PDF) {
    const bmp = await createImageBitmap(file).catch(() => null);
    if (bmp) { item.meta = { width: bmp.width, height: bmp.height }; bmp.close(); }
    else if (det.format === Fmt.HEIC) item.meta = {};
  }
  const outputs = [];
  const errors = [];
  const limits = await probeCanvasLimits();
  const pool = new WorkerPool(suggestedConcurrency());
  try {
    await runConversion({
      items: [item],
      settings: { ...BASE_SETTINGS, ...extra, format, limits },
      pool, limits, heicEncodeEnabled: HEIC_ENCODE_ENABLED,
      isCancelled: () => false,
      hooks: {
        onStart() {}, onProgress() {}, onDone() {}, onWarning() {},
        onOutput(_i, name, blob) { outputs.push({ name, blob }); },
        onBatchOutput(name, blob) { outputs.push({ name, blob }); },
        onError(_i, e) { errors.push(e.message); },
        onUnsupported(_i, r) { errors.push(r); },
        onCancelled() {},
      },
    });
  } finally { pool.shutdown(); }
  return { outputs, errors };
}

async function pdfPages(blob) {
  const doc = await openPdf(new Uint8Array(await blob.arrayBuffer()));
  try { return doc.numPages; } finally { await doc.destroy(); }
}

document.getElementById('reload').addEventListener('click', () => location.reload());

document.getElementById('run').addEventListener('click', async () => {
  const btn = document.getElementById('run');
  btn.disabled = true;
  tbody.innerHTML = ''; rows.length = 0; n = 0;
  document.getElementById('summary').textContent = '執行中…';

  const caps = detectCapabilities();
  const limits = await probeCanvasLimits();
  document.getElementById('env').textContent =
    `${navigator.userAgent}｜線上狀態：${navigator.onLine ? '線上' : '離線'}`
    + `｜Worker ${suggestedConcurrency()}｜繪圖上限 ${limits.maxDimension} / ${limits.maxArea}`
    + `｜缺少能力：${caps.missing.length ? caps.missing.join('、') : '無'}`;

  try {
    const [pdf, png, jpg, heic] = await Promise.all([
      fileOf(ASSETS.pdf, '01_三頁中文文字.pdf'),
      fileOf(ASSETS.png, '04_透明背景.png'),
      fileOf(ASSETS.jpg, '06_一般照片.jpg'),
      fileOf(ASSETS.heic, '07_直式含EXIF方向.heic'),
    ]);

    // 1 PDF → PNG
    let r = await convert(pdf, Fmt.PNG, { dpi: 150 });
    let ok = r.outputs.length === 3 && r.outputs.every((o, i) => o.name === `01_三頁中文文字_p00${i+1}.png`);
    let d = await getPngDpi(new Uint8Array(await r.outputs[0].blob.arrayBuffer()));
    let px = await pixels(r.outputs[0].blob);
    add('核心 1：PDF → PNG（3 頁、150 dpi）', ok && Math.abs(d.x - 150) < 0.5 && px.w === 1275,
        `${r.outputs.length} 個輸出，${r.outputs.map(o=>o.name).join(', ')}；第 1 頁 ${px.w}×${px.h}，pHYs ${d.x.toFixed(2)} dpi`);

    // 2 PDF → JPEG
    r = await convert(pdf, Fmt.JPEG, { dpi: 150, pageRange: '1' });
    d = getJpegDpi(new Uint8Array(await r.outputs[0].blob.arrayBuffer()));
    px = await pixels(r.outputs[0].blob);
    add('核心 2：PDF → JPEG（頁面範圍 1、150 dpi）', r.outputs.length === 1 && d && d.x === 150 && px.w === 1275,
        `${r.outputs[0].name}，${px.w}×${px.h}，JFIF ${d ? d.x : '無'} dpi`);

    // 3 PNG → PDF
    r = await convert(png, Fmt.PDF, { dpi: 150 });
    let pages = r.outputs.length ? await pdfPages(r.outputs[0].blob) : 0;
    add('核心 3：PNG → PDF', r.outputs.length === 1 && pages === 1,
        `${r.outputs.map(o=>o.name).join(', ')}，${pages} 頁，${r.outputs[0] ? r.outputs[0].blob.size : 0} B`);

    // 4 JPEG → PDF
    r = await convert(jpg, Fmt.PDF, { dpi: 150 });
    pages = r.outputs.length ? await pdfPages(r.outputs[0].blob) : 0;
    add('核心 4：JPEG → PDF', r.outputs.length === 1 && pages === 1,
        `${r.outputs.map(o=>o.name).join(', ')}，${pages} 頁，${r.outputs[0] ? r.outputs[0].blob.size : 0} B`);

    // 5 PNG → JPEG（透明 → 白底）
    r = await convert(png, Fmt.JPEG, { dpi: 300 });
    px = await pixels(r.outputs[0].blob);
    d = getJpegDpi(new Uint8Array(await r.outputs[0].blob.arrayBuffer()));
    const cornersOk = cname(px.tl) === '紅' && cname(px.tr) === '綠' && cname(px.bl) === '藍' && cname(px.br) === '黃';
    add('核心 5：PNG → JPEG（300 dpi、像素尺寸不變）', px.w === 800 && px.h === 600 && cornersOk && d.x === 300,
        `${px.w}×${px.h}，四角 ${[px.tl,px.tr,px.bl,px.br].map(cname).join('/')}，JFIF ${d.x} dpi`);

    // 6 JPEG → PNG
    r = await convert(jpg, Fmt.PNG, { dpi: 300 });
    px = await pixels(r.outputs[0].blob);
    d = getPngDpi(new Uint8Array(await r.outputs[0].blob.arrayBuffer()));
    add('核心 6：JPEG → PNG（300 dpi）', px.w === 1600 && px.h === 1200 && Math.abs(d.x - 300) < 0.5,
        `${px.w}×${px.h}，pHYs ${d.x.toFixed(2)} dpi`);

    // 7 HEIC → PNG（方向）
    r = await convert(heic, Fmt.PNG, { dpi: 300 });
    px = await pixels(r.outputs[0].blob);
    const rot = cname(px.tl) === '藍' && cname(px.tr) === '紅' && cname(px.bl) === '黃' && cname(px.br) === '綠';
    add('核心 7：HEIC → PNG（直式方向正確）', px.w === 900 && px.h === 1200 && rot,
        `${px.w}×${px.h}（直式），四角 ${[px.tl,px.tr,px.bl,px.br].map(cname).join('/')}`);

    // 8 HEIC → JPEG
    r = await convert(heic, Fmt.JPEG, { dpi: 300 });
    px = await pixels(r.outputs[0].blob);
    d = getJpegDpi(new Uint8Array(await r.outputs[0].blob.arrayBuffer()));
    add('核心 8：HEIC → JPEG（直式方向正確）', px.w === 900 && px.h === 1200 && d.x === 300,
        `${px.w}×${px.h}，JFIF ${d.x} dpi`);

    // 9 HEIC → PDF
    r = await convert(heic, Fmt.PDF, { dpi: 150 });
    pages = r.outputs.length ? await pdfPages(r.outputs[0].blob) : 0;
    add('核心 9：HEIC → PDF', r.outputs.length === 1 && pages === 1,
        `${r.outputs.map(o=>o.name).join(', ')}，${pages} 頁`);

    // 額外：合成單一多頁 PDF
    const pool2 = new WorkerPool(suggestedConcurrency());
    const merged = [];
    const items = [];
    for (const [f, nm] of [[png, '04_透明背景.png'], [jpg, '06_一般照片.jpg'], [heic, '07_直式含EXIF方向.heic']]) {
      const head = new Uint8Array(await f.slice(0, 4096).arrayBuffer());
      const det = detectBytes(head);
      const it = { id: nm, file: f, name: nm, format: det.format, meta: null };
      const bmp = await createImageBitmap(f).catch(() => null);
      if (bmp) { it.meta = { width: bmp.width, height: bmp.height }; bmp.close(); }
      items.push(it);
    }
    try {
      await runConversion({
        items, settings: { ...BASE_SETTINGS, format: Fmt.PDF, dpi: 150, pdf: { ...BASE_SETTINGS.pdf, merge: true }, limits },
        pool: pool2, limits, heicEncodeEnabled: HEIC_ENCODE_ENABLED, isCancelled: () => false,
        hooks: { onStart(){}, onProgress(){}, onDone(){}, onWarning(){}, onError(){}, onUnsupported(){}, onCancelled(){},
                 onOutput(_i,nm,b){ merged.push({name:nm,blob:b}); }, onBatchOutput(nm,b){ merged.push({name:nm,blob:b}); } },
      });
    } finally { pool2.shutdown(); }
    pages = merged.length ? await pdfPages(merged[0].blob) : 0;
    add('3 張圖 → 合成單一多頁 PDF', merged.length === 1 && pages === 3,
        `${merged.length} 個輸出，${pages} 頁`);

    // 額外：ZIP（STORE）
    const zip = new StreamingZip();
    r = await convert(pdf, Fmt.PNG, { dpi: 72 });
    for (const o of r.outputs) await zip.add(o.name, o.blob);
    const zblob = await zip.finish();
    add('ZIP 串流打包', zblob.size > 0 && zip.count === 3, `${zip.count} 個項目，${zblob.size.toLocaleString()} B`);

    // 額外：HEIC 輸出（Phase 2）
    if (HEIC_ENCODE_ENABLED) {
      r = await convert(png, Fmt.HEIC, { dpi: 150 });
      const head = r.outputs.length ? new Uint8Array(await r.outputs[0].blob.slice(0, 16).arrayBuffer()) : null;
      const brand = head ? new TextDecoder('latin1').decode(head.slice(4, 12)) : '';
      add('Phase 2：PNG → HEIF/HEIC', r.outputs.length === 1 && brand === 'ftypheic',
          `${r.outputs.length ? r.outputs[0].name : '無'}，ftyp「${brand}」，${r.outputs.length ? r.outputs[0].blob.size : 0} B`);
    } else {
      add('Phase 2：PNG → HEIF/HEIC', null, 'HEIC 輸出未啟用');
    }

    // 額外：沒有任何跨來源請求
    const here = location.origin;
    const ext = performance.getEntriesByType('resource').map(e => e.name)
      .filter(u => { try { return new URL(u, location.href).origin !== here; } catch { return false; } });
    add('整個流程沒有任何對外請求', ext.length === 0, ext.length ? ext.join(', ') : `全部 ${performance.getEntriesByType('resource').length} 筆都是同源`);

  } catch (e) {
    add('測試執行時發生例外', false, String((e && e.stack) || e));
  }

  const pass = rows.filter(x => x.ok === true).length;
  const fail = rows.filter(x => x.ok === false).length;
  const skip = rows.filter(x => x.ok === null).length;
  const s = document.getElementById('summary');
  s.textContent = `結果：${pass} 項 PASS、${fail} 項 FAIL${skip ? `、${skip} 項未執行` : ''}`;
  s.className = fail ? 'fail' : 'pass';
  btn.disabled = false;
});

// Service Worker 狀態
(async () => {
  const el = document.getElementById('swstate');
  if (!('serviceWorker' in navigator)) { el.textContent = 'Service Worker 狀態：這個瀏覽器環境不支援。'; return; }
  try {
    const regs = await navigator.serviceWorker.getRegistrations();
    const active = regs.some(r => r.active);
    el.textContent = `Service Worker 狀態：${active ? '已啟用（離線可用）' : '尚未安裝——請先開啟主頁 index.html 一次'}`
      + `｜快取：${(await caches.keys()).join(', ') || '無'}｜目前 ${navigator.onLine ? '線上' : '離線'}`;
  } catch (e) {
    el.textContent = 'Service Worker 狀態：查詢失敗（' + (e && e.message) + '）';
  }
})();
</script>
</body>
</html>
